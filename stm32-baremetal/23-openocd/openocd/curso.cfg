# =============================================================================
#  curso.cfg - configuração do OpenOCD para as Nucleo do curso
#
#  Uso:   openocd -c "set MCU f4" -f openocd/curso.cfg
#         (ou "make MCU=f4 openocd" dentro do módulo 23)
#
#  Um arquivo .cfg do OpenOCD é um script TCL executado de cima para baixo.
#  Ele precisa responder três perguntas: QUAL adaptador? QUAL transporte?
#  QUAL chip? Depois disso podemos acrescentar eventos e comandos próprios.
# =============================================================================

# ---- Parâmetro vindo da linha de comando (-c "set MCU f0") ----------------
if {![info exists MCU]} {
    set MCU f4
}

# ---- 1. Adaptador: o ST-LINK/V2-1 embutido na Nucleo ----------------------
# interface/stlink.cfg escolhe o driver (hla ou dapdirect) e o transporte SWD.
source [find interface/stlink.cfg]

# ---- 2. Velocidade do SWD (kHz) --------------------------------------------
# O ST-LINK arredonda para a frequência suportada mais próxima.
adapter speed 4000

# ---- 3. Alvo -----------------------------------------------------------------
# Os scripts de target criam: o DAP, o target ($_TARGETNAME, ex.: stm32f4x.cpu),
# o banco de Flash (driver stm32f1x/stm32f2x) e os eventos de reset.
if {$MCU eq "f0"} {
    source [find target/stm32f0x.cfg]
} else {
    source [find target/stm32f4x.cfg]
}

# ---- 4. Reset ----------------------------------------------------------------
# A Nucleo liga o NRST do alvo ao ST-LINK: dá para usar reset por hardware.
# "srst_only srst_nogate" + "connect_assert_srst" permitiria conectar mesmo
# com o chip em low-power; deixamos o padrão do target (reset por software
# via SYSRESETREQ) e o modo "connect under reset" fica no README.
# reset_config srst_only srst_nogate connect_assert_srst

# ---- 5. Eventos --------------------------------------------------------------
# Executados automaticamente pelo OpenOCD.
$_TARGETNAME configure -event gdb-attach {
    echo "\[curso\] GDB conectou: parando o alvo"
    halt
}
$_TARGETNAME configure -event reset-end {
    echo "\[curso\] reset concluído"
}

# ---- 6. Comandos próprios (procedimentos TCL) --------------------------------
source [file join [file dirname [info script]] curso.tcl]

# ---- 7. Portas dos servidores (estes são os valores padrão) -----------------
gdb_port    3333
telnet_port 4444
tcl_port    6666
