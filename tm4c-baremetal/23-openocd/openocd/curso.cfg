# =============================================================================
#  curso.cfg - configuração do OpenOCD para as LaunchPads do curso
#
#  Uso:   openocd -c "set MCU 123" -f openocd/curso.cfg
#         (ou "make MCU=123 openocd" dentro do módulo 23)
#
#  Um .cfg do OpenOCD é um script TCL executado de cima para baixo. Ele
#  responde: QUAL adaptador? QUAL transporte? QUAL chip? Depois acrescentamos
#  eventos e comandos próprios.
# =============================================================================

if {![info exists MCU]} {
    set MCU 123
}

# ---- 1+2+3. Adaptador (ICDI), transporte e alvo -----------------------------
# Os arquivos board/ fazem tudo: interface/ti-icdi.cfg (driver "hla" com
# layout ti-icdi, transporte hla_jtag) + target/stellaris.cfg (target
# $_TARGETNAME e banco de Flash "stellaris").
# Para ler: /usr/share/openocd/scripts/board/ek-tm4c123gxl.cfg
if {$MCU eq "129"} {
    source [find board/ek-tm4c1294xl.cfg]
} else {
    source [find board/ek-tm4c123gxl.cfg]
}

# ---- 4. Eventos --------------------------------------------------------------
$_TARGETNAME configure -event gdb-attach {
    echo "\[curso\] GDB conectou: parando o alvo"
    halt
}
$_TARGETNAME configure -event reset-end {
    echo "\[curso\] reset concluído"
}

# ---- 5. Comandos próprios ----------------------------------------------------
source [file join [file dirname [info script]] curso.tcl]

# ---- 6. Portas (valores padrão) ----------------------------------------------
gdb_port    3333
telnet_port 4444
tcl_port    6666
